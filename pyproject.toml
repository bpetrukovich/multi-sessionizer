[project]
name = "multi-sessionizer"
version = "0.1.1"
description = "Create and switch between tmux project sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
multi-sessionizer = "multi_sessionizer.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"